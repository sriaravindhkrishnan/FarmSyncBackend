spring.application.name=FarmSyncBackend
server.port=${PORT:8080}
weather-api-base-url=https://api.open-meteo.com
weather-probability-threshold=80
weather-probability-minimum-to-rain=50
weather-default-plus-in-minute=10
weather-minimum-precipitation=2.5
weather-timezone=Asia/Kolkata
weather-regular-forecaster=24
weather-regular-fields=precipitation_probability,rain,showers,precipitation,weather_code
weather-current-fields=temperature_2m,relative_humidity_2m,wind_speed_10m,rain,showers,precipitation,weather_code
#weather-regular-cron=0 30 5 * * *
#weather-regular-cron=0,20 * * * * *
weather-regular-cron=0 */2 * * * *